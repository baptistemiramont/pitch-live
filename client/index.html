<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pitch-live</title>
  </head>
  <body>
    <header class="hud">
      <span id="status">Connexion…</span>
      <span id="clock"></span>
      <span id="received"></span>
      <span id="latency"></span>
      <label>
        Fréquence demandée
        <select id="rate">
          <option value="25" selected>25 images/s</option>
          <option value="10">10 images/s</option>
          <option value="5">5 images/s</option>
          <option value="1">1 image/s</option>
        </select>
      </label>
      <label>
        Format
        <select id="format">
          <option value="json">JSON</option>
          <option value="binary">binaire</option>
        </select>
      </label>
      <label><input type="checkbox" id="smoothing" /> Lisser le mouvement</label>
      <label><input type="checkbox" id="slow-client" /> Simuler un client lent</label>
    </header>
    <canvas id="pitch"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
