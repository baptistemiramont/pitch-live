<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pitch-live</title>
  </head>
  <body>
    <aside class="panel">
      <h1>pitch-live</h1>
      <p id="status" class="status" data-status="connecting">Connecting…</p>

      <h2>Score</h2>
      <p class="score">
        <span class="home">Home</span>
        <strong id="score">0 - 0</strong>
        <span class="away">Away</span>
      </p>
      <ol id="events" class="events"></ol>

      <h2>Match</h2>
      <dl>
        <dt>Period</dt>
        <dd id="period">…</dd>
        <dt>Match time</dt>
        <dd id="clock">…</dd>
        <dt>Ball</dt>
        <dd id="ball">…</dd>
      </dl>

      <h2>Reception</h2>
      <dl>
        <dt>Frames received</dt>
        <dd id="received">…</dd>
        <dt>Frames skipped</dt>
        <dd id="skipped">…</dd>
        <dt>Frame size</dt>
        <dd id="size">…</dd>
      </dl>

      <h2>Average latency</h2>
      <dl>
        <dt>On receipt</dt>
        <dd id="latency-reception">…</dd>
        <dt>On screen</dt>
        <dd id="latency-screen">…</dd>
      </dl>

      <h2>Settings</h2>
      <label class="field">
        <span>Requested rate</span>
        <select id="rate">
          <option value="25" selected>25 frames/s</option>
          <option value="10">10 frames/s</option>
          <option value="5">5 frames/s</option>
          <option value="1">1 frame/s</option>
        </select>
      </label>
      <label class="field">
        <span>Frame format</span>
        <select id="format">
          <option value="json">JSON</option>
          <option value="binary">binary</option>
        </select>
      </label>
      <label class="toggle">
        <input type="checkbox" id="smoothing" />
        Smooth the movement
        <small>at the cost of one frame of delay</small>
      </label>
      <label class="toggle">
        <input type="checkbox" id="slow-client" />
        Simulate a slow client
        <small>60 ms of work per frame, with 40 ms between frames</small>
      </label>
    </aside>
    <canvas id="pitch"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
